name: roadmap

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: lens
          POSTGRES_DB: lens_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # A throwaway CI database; the real connection is always injected via LENS_DB_URL.
      LENS_TEST_DB_URL: postgresql://postgres:lens@localhost:5432/lens_test
      # Fail, don't skip, if the database tests cannot run here.
      LENS_REQUIRE_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pytest>=8.0" "pyyaml>=6.0" "psycopg[binary]>=3.1"
      - name: Roadmap is valid and ROADMAP.md is current
        run: python scripts/roadmap.py check
      - name: Tests
        run: python -m pytest -q -rs tests
